tests:
  mc.comm.stress.native:
    platform_allow:
      - native_sim/native/64
    tags:
      - mc
      - comm
  mc.comm.stress.sender:
    build_only: true
    extra_args: CONF_FILE=prj_sender.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - mc
      - uart
  mc.comm.stress.receiver:
    build_only: true
    extra_args: CONF_FILE=prj_receiver.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - mc
      - uart
